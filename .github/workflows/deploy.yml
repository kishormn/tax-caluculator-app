name: Deploy Tax App to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Force GitHub's internal actions to safely run on Node.js 24 ahead of the deadline
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Updated target environment to Node 24
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Upload Production Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy Live
        id: deployment
        uses: actions/deploy-pages@v4
